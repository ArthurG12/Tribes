services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4317:4317"
    environment:
      NODE_ENV: development
      BACKEND_URL: http://backend:4000
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    init: true
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "4000"
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgres://tribes:tribes_dev_password@database:5432/tribes
      FRONTEND_URL: http://localhost:4317
      SMTP_URL: smtp://mailhog:1025
      EMAIL_FROM: Tribes <no-reply@tribes.local>
      MAILHOG_API_URL: http://mailhog:8025
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    init: true
    depends_on:
      database:
        condition: service_healthy
      mailhog:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tribes
      POSTGRES_USER: tribes
      POSTGRES_PASSWORD: tribes_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tribes -d tribes"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "8026:8025"
    expose:
      - "1025"

volumes:
  frontend_node_modules:
  frontend_next_cache:
  backend_node_modules:
  postgres_data:
